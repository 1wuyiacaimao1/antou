  :root{
    --floor:#F7F4EE;
    --wood:#3A2C21;
    --wood-hi:#4A3A2C;
    --wood-front:#433327;
    --wood-in:#291F17;
    --wood-edge:#1C130C;
    --wood-text:#D6C6B0;
    --wood-text-2:#9C8A72;
    --note:#FDF9F1;
    --ink:#232019;
    --ink2:#6B6862;
    --stamp:#C25A40;
    --leaf:#C3CFB9;
    --leaf-2:#B2C0A6;
    --pot:#CBB49C;
    --glass-fill:#F1EADF;
    --water:#DCE6E1;
    --pen:#E2D8C8;
    --brush:brush,"Kaiti SC",KaiTi,serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    background:var(--floor);color:var(--ink);
    font-family:var(--sans);-webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;padding:26px;
  }

  .stage{
    width:min(1280px,100%);
    min-height:calc(100vh - 52px);
    display:flex;flex-direction:column;
  }

      inset 0 -5px 0 var(--wood-edge),

      0 1px 0 rgba(0,0,0,.22),

  }

  /* ---------- 桌上小物 ---------- */
  .deco{position:absolute;pointer-events:none;
        filter:url(#wobble) drop-shadow(4px 9px 11px rgba(20,12,6,.45))}
  .deco.pen{pointer-events:auto;cursor:pointer;
        transition:transform .18s ease,filter .18s ease}
  .deco.pen:hover{transform:rotate(-14deg) translateY(-4px);
        filter:drop-shadow(7px 14px 16px rgba(20,12,6,.55))}
  .pen-hint{
    position:absolute;right:46px;bottom:104px;pointer-events:none;
    font-size:11px;letter-spacing:.12em;color:var(--wood-text-2);
    opacity:0;transition:opacity .18s ease;
  }
  .pen-hint.on{opacity:1}
  .deco.pen:hover + .pen-hint{opacity:1}
  .deco .out{fill:none;stroke:rgba(34,22,12,.62);stroke-width:1.2;
             stroke-linejoin:round;stroke-linecap:round}
  .glass{left:44px;top:110px;width:64px}
  .plant{right:40px;top:6px;width:100px}
  .pen{right:46px;bottom:86px;width:124px;transform:rotate(-16deg)}

  /* ---------- 便签 ---------- */
  .notes{width:min(600px,100%);margin:6px auto 0}
  .note{background:var(--note);position:relative;
        box-shadow:0 2px 6px rgba(0,0,0,.28), 0 16px 34px rgba(0,0,0,.30)}
  .note-big{
    width:min(540px,100%);margin:0 auto;padding:42px 44px 38px;
    transform:rotate(-1.1deg);text-align:center;
  }
  .status{
    font-family:var(--brush);font-size:clamp(44px,5vw,70px);
    line-height:1.18;letter-spacing:.02em;transform:rotate(-.4deg);
    text-shadow:0 1px 0 rgba(31,30,27,.06),0 8px 16px rgba(31,30,27,.10);
  }
  .date{display:block;font-size:11px;letter-spacing:.22em;color:var(--ink2);margin-top:14px}

  .note-small{
    width:292px;margin:16px 0 0 auto;padding:18px 20px 14px;
    transform:rotate(1.4deg);
  }
  .cap{font-size:10px;letter-spacing:.22em;color:#A8A39A;margin-bottom:8px}
  .row{display:grid;grid-template-columns:40px 1fr;gap:10px;padding:5px 0;
       align-items:baseline;text-decoration:none;color:inherit}
  .row .d{font-family:var(--brush);font-size:14px;color:var(--ink2);transition:color .18s}
  .row .t{font-size:13px;line-height:1.5;color:#33312D}
  .row:hover .d{color:var(--stamp)}

  .tray-inner{
    height:164px;display:grid;grid-template-columns:repeat(5,1fr);
    box-shadow:inset 0 16px 22px -14px rgba(0,0,0,.85);
  }
  .cell{padding:18px 14px 12px;border-right:1px solid rgba(255,230,200,.08);
        display:flex;flex-direction:column;text-decoration:none;color:inherit;
        transition:background .18s}
  .cell:last-child{border-right:none}
  .cell:hover{background:rgba(255,235,205,.07)}
  .cell .name{font-family:var(--brush);font-size:20px;color:var(--wood-text)}
  .cell .count{font-size:10px;color:var(--wood-text-2);letter-spacing:.1em;margin-top:4px}
  .stack{margin-top:auto;display:flex;flex-direction:column;gap:3px}
  .stack i{display:block;height:1px;background:rgba(255,235,205,.16)}
  .stack i:nth-child(1){width:88%}
  .stack i:nth-child(2){width:62%}

    border:1px solid rgba(0,0,0,.5);
    border-radius:0 0 8px 8px;
    display:flex;align-items:center;gap:14px;padding:0 20px;
    cursor:grab;user-select:none;
    box-shadow:0 18px 30px -14px rgba(0,0,0,.55);
    transition:transform .18s ease;
  }
  .bar:active{cursor:grabbing}
  .bar:hover{transform:translateY(2px)}
  .handle{width:26px;height:3px;border-radius:2px;background:rgba(230,205,170,.34);transition:background .18s}
  .bar:hover .handle{background:var(--stamp)}
  .word{font-family:var(--brush);font-size:19px;color:var(--wood-text);letter-spacing:.04em}
  .hint{margin-left:auto;font-size:11px;color:var(--wood-text-2);letter-spacing:.06em}

  /* 地板上的场景锚点 */
  .floor-obj{position:absolute;pointer-events:none;
             filter:url(#wobble) drop-shadow(6px 12px 14px rgba(60,45,30,.18))}
  .chair{right:-10px;bottom:-6px;width:244px}
  .things{left:0;bottom:6px;width:296px}

  .things .d-out{fill:none;stroke:rgba(90,70,55,.40);stroke-width:1.6;
        stroke-linejoin:round;stroke-linecap:round}
  .things .d-stitch{fill:none;stroke:rgba(120,92,72,.40);stroke-width:1.5;
        stroke-dasharray:3 3;stroke-linecap:round}

<script>
(function(){
  const tray = document.getElementById('tray');
  const bar  = document.getElementById('bar');
  const MAX  = 164, DAMP = 0.6, THRESH = 60, VEL = 0.5;
  let startY = 0, startH = 0, lastY = 0, lastT = 0, vy = 0, dragging = false, moved = 0;
  const isOpen = () => tray.offsetHeight > MAX * 0.5;
  function settle(open){
    tray.style.transition = 'height .3s cubic-bezier(.22,.61,.36,1)';
    tray.style.height = open ? MAX + 'px' : '0px';
  }
  bar.addEventListener('pointerdown', e => {
    dragging = true; startY = lastY = e.clientY;
    lastT = performance.now(); startH = tray.offsetHeight; vy = 0; moved = 0;
    tray.style.transition = 'none';
    bar.setPointerCapture(e.pointerId);
  });
  bar.addEventListener('pointermove', e => {
    if(!dragging) return;
    const dy = (e.clientY - startY) * DAMP;
    const now = performance.now(), dt = Math.max(now - lastT, 1);
    vy = (e.clientY - lastY) / dt;
    lastY = e.clientY; lastT = now;
    moved = Math.max(moved, Math.abs(e.clientY - startY));
    tray.style.height = Math.min(Math.max(startH + dy, 0), MAX) + 'px';
  });
  bar.addEventListener('pointerup', e => {
    if(!dragging) return;
    dragging = false;
    const dy = (e.clientY - startY) * DAMP;
    if(moved < 6){ settle(!isOpen()); }
    else if(dy > THRESH || vy > VEL){ settle(true); }
    else if(dy < -THRESH || vy < -VEL){ settle(false); }
    else { settle(startH > MAX * 0.5); }
    bar.releasePointerCapture(e.pointerId);
  });
  bar.addEventListener('keydown', e => {
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); settle(!isOpen()); }
  });
  bar.tabIndex = 0;
})();

/* ---------- 点笔写一条 ---------- */
(function(){
  var REPO = "OWNER/REPO";                 // ← 换成你的仓库，例如 wuyi/wuyi.github.io
  var PATH = "src/content/journal";
  var pen  = document.getElementById("penBtn");
  var hint = document.getElementById("penHint");

  function pad(n){ return n < 10 ? "0" + n : "" + n; }

  function open() {
    var d = new Date();
    var ymd = d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
    if (REPO.indexOf("OWNER") === 0) {
      hint.textContent = "还没接仓库";
      hint.classList.add("on");
      setTimeout(function(){ hint.classList.remove("on"); }, 2200);
      return;
    }
    var tpl = [
      "---",
      "date: " + ymd + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()),
      "title: ",
      "tags: []",
      "draft: true",
      "---",
      "",
      ""
    ].join("\n");
    var url = "https://github.com/" + REPO + "/new/main/" + PATH + "/" + ymd +
              ".md?filename=" + encodeURIComponent(ymd + ".md") +
              "&value=" + encodeURIComponent(tpl);
    window.open(url, "_blank", "noopener");
  }

  pen.addEventListener("click", open);
  pen.addEventListener("keydown", function(e){
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
  });
})();
</script>
