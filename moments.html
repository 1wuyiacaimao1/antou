    background-repeat:no-repeat;
    min-height:100vh;
    display:flex;justify-content:center;
    padding:48px 32px;
  }
  .sheet{
    width:820px;max-width:100%;
    background:var(--paper);
    border-radius:14px;
    padding:52px 72px 56px;
    box-shadow:
      inset 0 -5px 0 rgba(0,0,0,.10),
      0 30px 60px -22px rgba(0,0,0,.65);
    display:flex;flex-direction:column;
  }
  @media (min-width:1400px){ .sheet{width:880px;padding:52px 110px 56px} }
  @media (min-width:1700px){ .sheet{width:960px;padding:52px 150px 56px} }

  .back{
    align-self:flex-start;
    font-size:12px;letter-spacing:.1em;color:var(--ink2);
    text-decoration:none;padding-bottom:2px;border-bottom:1px solid transparent;
    transition:color .18s,border-color .18s;
  }
  .back:hover{color:var(--stamp);border-color:var(--stamp)}

  .head{margin:40px 0 0;display:flex;align-items:baseline;gap:16px}
  .head h1{
    font-family:var(--brush);font-size:46px;font-weight:400;
    letter-spacing:.02em;line-height:1;
  }
  .head .count{font-size:11px;color:#A8A39A;letter-spacing:.14em}
  .lede{margin-top:12px;font-size:13px;line-height:1.9;color:var(--ink2);max-width:520px}

  /* ---------- 叠放区 ---------- */
  .stage{
    position:relative;
    margin:44px 0 0;
    flex:1;
    min-height:420px;
    display:flex;align-items:center;justify-content:center;
  }
  .deck{
    position:relative;width:100%;height:400px;
    touch-action:none;
  }
  .deck.pile{cursor:pointer}
  .deck.viewer{cursor:grab}
  .deck.viewer.dragging{cursor:grabbing}

  .card{
    position:absolute;left:50%;top:50%;
    height:352px;
    background:#FFFDF8;
    padding:9px;
    border-radius:4px;
    box-shadow:0 14px 30px -14px rgba(60,40,20,.50), 0 2px 6px rgba(60,40,20,.16);
    will-change:transform,opacity;
    transform-origin:50% 50%;
  }
  .card svg{display:block;height:100%;width:auto;border-radius:2px}

  /* ---------- 详情信息 ---------- */
  .info{
    margin-top:30px;max-width:600px;
    min-height:96px;
  }
  .info .d{
    display:block;font-family:var(--brush);font-size:15px;color:var(--ink2);
    letter-spacing:.05em;
  }
  .info h2{
    font-family:var(--brush);font-size:30px;font-weight:400;
    line-height:1.35;margin-top:8px;
  }
  .info p{margin-top:10px;font-size:14.5px;line-height:1.9;color:#3A362F}
  .info .tags{margin-top:10px;font-size:11px;color:#A8A39A;letter-spacing:.1em}

  .hint{
    margin-top:8px;font-size:11px;letter-spacing:.12em;color:#B3AB9C;
    opacity:1;transition:opacity .3s ease;
  }
  .hint.hide{opacity:0}

  .close{
    position:absolute;right:0;top:-4px;
    font-size:11px;letter-spacing:.14em;color:#A8A39A;
    background:none;border:none;cursor:pointer;font-family:inherit;
    opacity:0;pointer-events:none;transition:opacity .3s ease,color .18s;
  }
  .close.on{opacity:1;pointer-events:auto}
  .close:hover{color:var(--stamp)}

  .dotbar{display:flex;gap:6px;margin-top:16px}
  .dotbar i{width:5px;height:5px;border-radius:50%;background:#DED6C6;transition:background .25s}
  .dotbar i.on{background:var(--stamp)}
</style>
</head>
<body>

<section class="panel">
  <div class="sheet">
    <a class="back" href="#">← 书桌</a>

    <div class="head">
      <h1>瞬间</h1>
      <span class="count">42 张</span>
    </div>
    <p class="lede">照片按时间叠在桌上。点最上面那张翻开，左右拖动翻下一张。</p>

    <div class="stage">
      <button class="close" id="close">收 起</button>
      <div class="deck pile" id="deck">

        <article class="card" data-date="10.14 星期三" data-title="东钱湖" data-text="风把水面吹出一层细纹，站了很久。回来的时候下坡，一路没踩踏板。" data-tags="湖边 · 出门">

            <rect width="540" height="352" fill="#E6DCC8"/>

            <rect y="201" width="540" height="3" fill="#C6B69A"/>
          </svg>

        <article class="card" data-date="10.08 星期四" data-title="宿舍窗台" data-text="下午四点的光刚好落在桌角，把水杯的影子拉得很长。" data-tags="光 · 日常">
          <svg width="282" height="352" viewBox="0 0 282 352" preserveAspectRatio="none">
            <rect width="282" height="352" fill="#EDE4D4"/>

        </article>

        <article class="card" data-date="10.02 星期日" data-title="雨后的操场" data-text="一个人也没有。跑道边缘还积着水，映着灰白的天。" data-tags="雨 · 学校">
          <svg width="540" height="352" viewBox="0 0 540 352" preserveAspectRatio="none">
            <rect width="540" height="352" fill="#E3DDCE"/>
            <rect y="230" width="540" height="122" fill="#CFC7B4"/>

          </svg>
        </article>

        <article class="card" data-date="09.26 星期六" data-title="食堂的窗" data-text="玻璃上起了雾，随手画了个圈，外面的人从圈里走过去。" data-tags="雾 · 食堂">
          <svg width="352" height="352" viewBox="0 0 352 352" preserveAspectRatio="none">
            <rect width="352" height="352" fill="#E9E2D1"/>

        <article class="card" data-date="09.20 星期日" data-title="图书馆四楼" data-text="靠窗那张桌子空着，坐下来之后发现暖气很足。" data-tags="图书馆">
          <svg width="540" height="352" viewBox="0 0 540 352" preserveAspectRatio="none">
            <rect width="540" height="352" fill="#E7DFCE"/>
            <rect x="60" y="120" width="420" height="20" fill="#D5C9B1"/>
            <rect x="60" y="140" width="420" height="120" fill="#DFD5C0"/>
          </svg>
        </article>

      </div>
    </div>

    <div class="info" id="info">
      <span class="d" id="i-date">10.14 星期三</span>
      <h2 id="i-title">东钱湖</h2>
      <p id="i-text">风把水面吹出一层细纹，站了很久。回来的时候下坡，一路没踩踏板。</p>
      <div class="tags" id="i-tags">湖边 · 出门</div>
      <div class="dotbar" id="dots"></div>
    </div>

    <div class="hint" id="hint">点 照 片 翻 开</div>

  </div>
</section>

<script>
(function(){
  const deck  = document.getElementById('deck');
  const cards = Array.from(deck.querySelectorAll('.card'));
  const close = document.getElementById('close');
  const hint  = document.getElementById('hint');
  const info  = document.getElementById('info');
  const dots  = document.getElementById('dots');

  const N = cards.length;
  let mode = 'pile';
  let active = 0;

  cards.forEach(function(_, i){
    const d = document.createElement('i');
    if(i === 0) d.className = 'on';
    dots.appendChild(d);
  });

  function drawInfo(i){
    const c = cards[i];
    document.getElementById('i-date').textContent  = c.dataset.date;
    document.getElementById('i-title').textContent = c.dataset.title;
    document.getElementById('i-text').textContent  = c.dataset.text;
    document.getElementById('i-tags').textContent  = c.dataset.tags;
    Array.from(dots.children).forEach(function(d, k){
      d.className = (k === i) ? 'on' : '';
    });
  }

  function gap(){
    return Math.max(300, deck.clientWidth * 0.56);
  }

  /* ---------- 叠放 ---------- */
  function layoutPile(){
    cards.forEach(function(c, i){
      c.style.transition = 'transform .45s cubic-bezier(.22,.61,.36,1), opacity .45s ease';
      c.style.transform =
        'translate(-50%,-50%) translateY(' + (i * 11) + 'px)' +
        ' scale(' + (1 - i * 0.028) + ')' +
        ' rotate(' + (i % 2 ? 1.1 : -1.1) + 'deg)';
      c.style.opacity = (i === 0) ? 1 : Math.max(0.25, 1 - i * 0.16);
      c.style.zIndex  = 20 - i;
    });
  }

  /* ---------- 浏览：progress 是连续位移，单位是「张」 ---------- */
  function layoutViewer(progress, animate){
    const g = gap();
    cards.forEach(function(c, i){
      const d = i - (active + progress);
      const abs = Math.abs(d);
      c.style.transition = animate
        ? 'transform .42s cubic-bezier(.22,.61,.36,1), opacity .42s ease'
        : 'none';
      c.style.transform =
        'translate(-50%,-50%) translateX(' + (d * g) + 'px)' +
        ' scale(' + (1 - Math.min(abs, 1.6) * 0.12) + ') rotate(0deg)';
      c.style.opacity = abs < 0.5 ? 1 : Math.max(0, 1 - (abs - 0.5) * 0.85);
      c.style.zIndex  = 20 - Math.round(abs);
    });
  }

  function enterViewer(i){
    mode = 'viewer'; active = i;
    deck.classList.remove('pile');
    deck.classList.add('viewer');
    close.classList.add('on');
    hint.classList.add('hide');
    drawInfo(i);
    layoutViewer(0, true);
  }

  function exitViewer(){
    mode = 'pile';
    deck.classList.remove('viewer');
    deck.classList.add('pile');
    close.classList.remove('on');
    hint.classList.remove('hide');
    layoutPile();
  }

  /* ---------- 点击 ---------- */
  let startX = 0, lastX = 0, startActive = 0, dragging = false, moved = 0;

  deck.addEventListener('pointerdown', function(e){
    startX = lastX = e.clientX;
    startActive = active;
    dragging = true;
    moved = 0;
    if(mode === 'viewer') deck.classList.add('dragging');
    deck.setPointerCapture(e.pointerId);
  });

  deck.addEventListener('pointermove', function(e){
    if(!dragging) return;
    const dx = e.clientX - startX;
    moved = Math.max(moved, Math.abs(dx));
    if(mode === 'pile') return;

    const g = gap();
    let p = -dx / g;
    // 到头了给一点阻尼，不许无限拖
    const edge = (startActive + p < 0) || (startActive + p > N - 1);
    if(edge) p = -dx / (g * 1.9);
    layoutViewer(p, false);
    lastX = e.clientX;
  });

  deck.addEventListener('pointerup', function(e){
    if(!dragging) return;
    dragging = false;
    deck.classList.remove('dragging');

    const dx = e.clientX - startX;
    const g = gap();

    if(mode === 'pile'){
      if(moved < 8) enterViewer(0);
      return;
    }

    // 位移过四分之一张就翻页
    let next = active;
    if(dx < -g * 0.22 && active < N - 1) next = active + 1;
    else if(dx > g * 0.22 && active > 0) next = active - 1;

    if(next !== active){
      active = next;
      drawInfo(active);
    }
    layoutViewer(0, true);
  });

  deck.addEventListener('pointercancel', function(){
    dragging = false;
    deck.classList.remove('dragging');
    if(mode === 'viewer') layoutViewer(0, true);
  });

  close.addEventListener('click', exitViewer);

  window.addEventListener('keydown', function(e){
    if(mode !== 'viewer') return;
    if(e.key === 'ArrowRight' && active < N - 1){ active++; drawInfo(active); layoutViewer(0, true); }
    if(e.key === 'ArrowLeft'  && active > 0){ active--; drawInfo(active); layoutViewer(0, true); }
    if(e.key === 'Escape') exitViewer();
  });

  window.addEventListener('resize', function(){
    if(mode === 'pile') layoutPile(); else layoutViewer(0, true);
  });

  layoutPile();
})();
</script>
</body>
</html>
